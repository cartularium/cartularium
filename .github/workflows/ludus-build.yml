name: ludus-build

# Path-filtered: runs only when ludus sources, brand tokens, chrome
# primitives, or the workflow itself change. Site-build smoke test plus the
# offline corpus staleness sweep — the judge/oracle CLIs need live Google
# credentials and are not CI-testable, but `oracle --check` only recomputes
# the verified-stamp hashes.

on:
  pull_request:
    paths:
      - "packages/ludus/**"
      - "packages/brand/**"
      - "packages/chrome/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ludus-build.yml"
  push:
    branches: [main]
    paths:
      - "packages/ludus/**"
      - "packages/brand/**"
      - "packages/chrome/**"
      - "pnpm-lock.yaml"

concurrency:
  group: ludus-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json `packageManager`
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # no typecheck here: the judge/oracle TS imports assay's built types,
      # which need a full assay+contracts build — out of scope for site smoke
      - name: Build ludus site
        run: pnpm --filter @cartularium/ludus run build:site

      - name: Corpus staleness sweep
        working-directory: packages/ludus
        run: pnpm run oracle --check problems/*.yaml
