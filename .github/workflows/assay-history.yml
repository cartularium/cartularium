name: assay-history

# Weekly engine drift recording for assay. Installs LibreOffice + the assay
# build chain, regenerates fixtures for CI-friendly engines, records a history
# row, opens a PR for review. Manual `workflow_dispatch` available with
# dry-run + note inputs. Ported from the pre-monorepo `cartularium/assay`
# repo's history.yml.

on:
  schedule:
    # Monday 06:00 UTC — clear of weekend + US-east mornings
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute deltas but write nothing (no PR)"
        type: boolean
        default: false
      note:
        description: "Free-form note attached to the run row"
        type: string
        default: ""
      include_gsheets:
        description: "Also regenerate Google Sheets fixtures when OAuth secrets are configured"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

# one history run at a time — gating at workflow level avoids spurious failures
concurrency:
  group: assay-history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install libreoffice + soffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      # Version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync (python deps)
        run: uv sync --frozen
        working-directory: packages/assay

      - name: Build assay
        run: pnpm --filter assay run build

      - name: Configure Google Sheets credentials
        id: gsheets
        working-directory: packages/assay
        env:
          ASSAY_GOOGLE_CREDENTIALS_JSON: ${{ secrets.ASSAY_GOOGLE_CREDENTIALS_JSON }}
          ASSAY_GOOGLE_TOKEN_JSON: ${{ secrets.ASSAY_GOOGLE_TOKEN_JSON }}
          ASSAY_SPREADSHEET_ID: ${{ secrets.ASSAY_SPREADSHEET_ID }}
        run: |
          if [ -n "$ASSAY_GOOGLE_CREDENTIALS_JSON" ] && [ -n "$ASSAY_GOOGLE_TOKEN_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute run-stamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Regenerate fixtures
        # Excel needs a desktop Office install and should run from a dedicated
        # Office-capable machine. Lattice needs the lattice repo + cargo build,
        # so that still lands via local/manual runs.
        env:
          ASSAY_GOOGLE_CREDENTIALS_JSON: ${{ secrets.ASSAY_GOOGLE_CREDENTIALS_JSON }}
          ASSAY_GOOGLE_TOKEN_JSON: ${{ secrets.ASSAY_GOOGLE_TOKEN_JSON }}
          ASSAY_SPREADSHEET_ID: ${{ secrets.ASSAY_SPREADSHEET_ID }}
          INCLUDE_GSHEETS: ${{ github.event_name == 'schedule' || inputs.include_gsheets }}
          GSHEETS_ENABLED: ${{ steps.gsheets.outputs.enabled }}
        run: |
          PLATFORMS="ironcalc,hyperformula,formulas,pycel,libreoffice"
          if [ "$INCLUDE_GSHEETS" = "true" ] && [ "$GSHEETS_ENABLED" = "true" ]; then
            PLATFORMS="gsheets,$PLATFORMS"
          elif [ "$INCLUDE_GSHEETS" = "true" ]; then
            echo "::notice::Skipping Google Sheets regeneration; ASSAY_GOOGLE_CREDENTIALS_JSON and ASSAY_GOOGLE_TOKEN_JSON secrets are not configured."
          fi
          node build/cli.js generate -p "$PLATFORMS"
        working-directory: packages/assay

      - name: Record history
        working-directory: packages/assay
        run: |
          NOTE="${{ inputs.note }}"
          NOTE="${NOTE:-weekly cron}"
          DRY_RUN=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN="--dry-run"; fi
          node build/cli.js history --record --trigger=cron --note "$NOTE" $DRY_RUN

      - name: Capture summary for PR body
        id: summary
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: packages/assay
        run: |
          {
            echo 'body<<EOF'
            echo '## History snapshot'
            echo ''
            echo '```'
            node build/cli.js history --inspect latest
            echo '```'
            echo ''
            echo '_PR opened by `.github/workflows/assay-history.yml` on the weekly cron. Review the diffs in `packages/assay/{history,divergences,fixtures}/` and merge if everything looks right._'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: ${{ inputs.dry_run != 'true' }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ASSAY_PR_TOKEN || github.token }}
          title: "assay history: cron ${{ steps.stamp.outputs.date }}"
          body: ${{ steps.summary.outputs.body }}
          branch: assay/history-cron-${{ steps.stamp.outputs.date }}
          delete-branch: true
          commit-message: |
            assay: weekly history cron ${{ steps.stamp.outputs.date }}
          # only stage paths the workflow touches — avoid sweeping incidental changes
          add-paths: |
            packages/assay/history/
            packages/assay/divergences/
            packages/assay/fixtures/
