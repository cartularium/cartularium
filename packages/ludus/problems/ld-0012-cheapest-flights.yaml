id: ld-0012
slug: cheapest-flights
title: Cheapest Flights
attribution: Adapted from "Cheapest Flights" in the astral.cafe Community Practice Problems sheet.
difficulty: 8
requires:
  - arrays
  - lambda
  - algorithmic
tags:
  - graphs
  - algorithms
statement: |
  You and a few friends are planning a holiday and want to spend as little
  money on flights as possible. You've gathered data on every flight
  available: where it departs, where it lands, and what it costs. Flights
  are one-way — a listed flight cannot be flown in reverse. The same pair of
  airports may be listed more than once at different prices.

  Given the source and destination airports, produce the cheapest possible
  route as a list of airports in visiting order, one per row, starting with
  the source and ending with the destination. There is always exactly one
  cheapest route.
challenges:
  - oner
  - generalized
  - golfed
template:
  sheets:
    - title: About
    - title: Input
    - title: Answer
  input: Input!B2:F22
  output: Answer!B3:B22
  answerHeaders:
    - Route
  spreadsheetId: 18YAPC-QSts5jOprDEcukx3XGH2ALs3vS9NcsjssE6eo
reference: =LET(fcol, Input!B3:B22, fr, FILTER(fcol, fcol <> ""), e, ROWS(fr), tt,
  ARRAY_CONSTRAIN(Input!C3:C22, e, 1), w, ARRAY_CONSTRAIN(Input!D3:D22, e, 1), src, Input!F3, dst,
  Input!F5, nodes, UNIQUE({fr; tt}), m, ROWS(nodes), big, 9999999, dini, ARRAYFORMULA(IF(nodes =
  src, 0, big)), pini, MAKEARRAY(m, 1, LAMBDA(rr, cc, "")), st, REDUCE({dini, pini}, SEQUENCE(m),
  LAMBDA(stt, k, LET(dist, INDEX(stt, , 1), prd, INDEX(stt, , 2), ed, ARRAYFORMULA(VLOOKUP(fr,
  {nodes, dist}, 2, FALSE) + w), nd, MAP(nodes, dist, LAMBDA(v, dv, MIN(dv, IFERROR(MIN(FILTER(ed,
  tt = v)), big)))), np, MAP(nodes, dist, prd, LAMBDA(v, dv, pv, LET(cand, IFERROR(MIN(FILTER(ed, tt
  = v)), big), IF(cand < dv, INDEX(fr, MATCH(1, ARRAYFORMULA((tt = v) * (ed = cand) * 1), 0)),
  pv)))), {nd, np}))), dist, INDEX(st, , 1), prd, INDEX(st, , 2), walked, REDUCE(dst, SEQUENCE(m),
  LAMBDA(acc, k, LET(cur, REGEXEXTRACT(acc, "^[^◆]+"), IF(cur = src, acc, VLOOKUP(cur, {nodes, prd},
  2, FALSE) & "◆" & acc)))), TRANSPOSE(SPLIT(walked, "◆")))
selftest:
  alt: =LET(fcol, Input!B3:B22, fr, FILTER(fcol, fcol <> ""), e, ROWS(fr), tt,
    ARRAY_CONSTRAIN(Input!C3:C22, e, 1), w, ARRAY_CONSTRAIN(Input!D3:D22, e, 1), src, Input!F3, dst,
    Input!F5, nodes, UNIQUE({fr; tt}), m, ROWS(nodes), big, 9999999, wm, MAKEARRAY(m, m, LAMBDA(r,
    c, IFERROR(MIN(FILTER(w, (fr = INDEX(nodes, r)) * (tt = INDEX(nodes, c)))), big))), dini,
    ARRAYFORMULA(IF(nodes = src, 0, big)), dist, REDUCE(dini, SEQUENCE(m), LAMBDA(dv, k, LET(relax,
    TRANSPOSE(BYCOL(ARRAYFORMULA(wm + dv), LAMBDA(col, MIN(col)))), ARRAYFORMULA(IF(dv < relax, dv,
    relax))))), walked, REDUCE(dst, SEQUENCE(m), LAMBDA(acc, k, LET(cur, REGEXEXTRACT(acc,
    "^[^◆]+"), IF(cur = src, acc, LET(ci, MATCH(cur, nodes, 0), dcur, INDEX(dist, ci), pidx,
    MATCH(1, ARRAYFORMULA((ARRAYFORMULA(dist + INDEX(wm, , ci)) = dcur) * 1), 0), INDEX(nodes, pidx)
    & "◆" & acc))))), TRANSPOSE(SPLIT(walked, "◆")))
