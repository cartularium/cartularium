id: ld-0013
slug: maze-solving
title: Maze Solving
attribution: Adapted from "Maze Solving" in the astral.cafe Community Practice Problems sheet.
difficulty: 8
requires:
  - arrays
  - lambda
  - algorithmic
tags:
  - graphs
  - algorithms
statement: |
  You find yourself stuck in a maze! You have to find the shortest way out.

  INPUT is a 19-by-19 grid: a cell containing 1 is a wall, an empty cell is
  open. You start at the top-left corner and must reach the bottom-right
  corner, moving up, down, left, or right through open cells; you cannot
  leave the grid.

  Give your answer as a list of coordinates of the form
  <row>|<column>, one per row of OUTPUT, from the start (1|1) to the exit
  (19|19). Rows count from the top, columns from the left. The corners are
  always open, and there is exactly one shortest path.
challenges:
  - oner
  - generalized
  - golfed
template:
  sheets:
    - title: About
    - title: Input
    - title: Answer
  input: Input!B2:T20
  output: Answer!B3:B62
  answerHeaders:
    - Path
  spreadsheetId: 16W65ltaZymUp7tQeHY1RIQ4QErxj9G02orpQdMYKkmc
reference: =LET(g, Input!B2:T20, rn, 19, cn, 19, big, 99999, brow, ARRAYFORMULA(SEQUENCE(1, cn) * 0
  + big), bcol, ARRAYFORMULA(SEQUENCE(rn) * 0 + big), init, MAKEARRAY(rn, cn, LAMBDA(r, c, IF(AND(r
  = 1, c = 1), 0, big))), dist, REDUCE(init, SEQUENCE(64), LAMBDA(dd, k, LET(up, {CHOOSEROWS(dd,
  SEQUENCE(rn - 1, 1, 2)); brow}, dn, {brow; CHOOSEROWS(dd, SEQUENCE(rn - 1))}, lf, {CHOOSECOLS(dd,
  SEQUENCE(1, cn - 1, 2)), bcol}, rt, {bcol, CHOOSECOLS(dd, SEQUENCE(1, cn - 1))}, nbv,
  ARRAYFORMULA(IF(up < dn, up, dn)), nbh, ARRAYFORMULA(IF(lf < rt, lf, rt)), cand,
  ARRAYFORMULA(IF(nbv < nbh, nbv, nbh) + 1), ARRAYFORMULA(IF(g <> 1, IF(dd < cand, dd, cand),
  big))))), walked, REDUCE(rn & "|" & cn, SEQUENCE(INDEX(dist, rn, cn)), LAMBDA(acc, k, LET(y,
  VALUE(REGEXEXTRACT(acc, "^(\d+)")), x, VALUE(REGEXEXTRACT(acc, "^\d+\|(\d+)")), dv, INDEX(dist, y,
  x), uu, IF(y = 1, big, INDEX(dist, y - 1, x)), ddn, IF(y = rn, big, INDEX(dist, y + 1, x)), ll,
  IF(x = 1, big, INDEX(dist, y, x - 1)), IF(uu = dv - 1, (y - 1) & "|" & x, IF(ddn = dv - 1, (y + 1)
  & "|" & x, IF(ll = dv - 1, y & "|" & (x - 1), y & "|" & (x + 1)))) & "◆" & acc))),
  TRANSPOSE(SPLIT(walked, "◆")))
selftest:
  alt: =LET(g, Input!B2:T20, rn, 19, cn, 19, big, 99999, init, MAKEARRAY(rn, cn, LAMBDA(r, c, IF(AND(r
    = rn, c = cn), 0, big))), dist, REDUCE(init, SEQUENCE(64), LAMBDA(dd, k, MAKEARRAY(rn, cn,
    LAMBDA(r, c, IF(INDEX(g, r, c) = 1, big, LET(best, MIN(IF(r = 1, big, INDEX(dd, r - 1, c)), IF(r
    = rn, big, INDEX(dd, r + 1, c)), IF(c = 1, big, INDEX(dd, r, c - 1)), IF(c = cn, big, INDEX(dd,
    r, c + 1))) + 1, MIN(INDEX(dd, r, c), best))))))), walked, REDUCE("1|1", SEQUENCE(INDEX(dist, 1,
    1)), LAMBDA(acc, k, LET(cur, REGEXEXTRACT(acc, "[^◆]+$"), y, VALUE(REGEXEXTRACT(cur, "^(\d+)")),
    x, VALUE(REGEXEXTRACT(cur, "\|(\d+)$")), dv, INDEX(dist, y, x), uu, IF(y = 1, big, INDEX(dist, y
    - 1, x)), ddn, IF(y = rn, big, INDEX(dist, y + 1, x)), ll, IF(x = 1, big, INDEX(dist, y, x -
    1)), acc & "◆" & IF(uu = dv - 1, (y - 1) & "|" & x, IF(ddn = dv - 1, (y + 1) & "|" & x, IF(ll =
    dv - 1, y & "|" & (x - 1), y & "|" & (x + 1))))))), TRANSPOSE(SPLIT(walked, "◆")))
compare:
  numbers:
    epsilon: 1e-9
  rowOrder: exact
