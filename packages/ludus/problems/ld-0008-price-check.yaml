id: ld-0008
slug: price-check
title: Price Check
difficulty: 1
tags:
  - lookup
statement: |
  Your client runs a small shop with a price list: one row per item, with its
  price. The list is in no particular order. Given the item named in the
  Wanted item cell, produce its price — a single number.

  The wanted item always appears in the list exactly once. Watch out: some
  item names share their first word, and the list is not sorted, so your
  lookup has to match the whole name exactly.
template:
  sheets:
    - title: About
    - title: Input
    - title: Answer
  input: Input!B2:E32
  output: Answer!B3:B3
  answerHeaders:
    - Price
  spreadsheetId: 1ZHvihkyM2jnUyZ4WEWCKv1ZCIkpq4cP_Oi9JkHRpHdY
reference: =VLOOKUP(Input!E3, Input!B3:C32, 2, FALSE)
selftest:
  alt: =INDEX(Input!C3:C32, MATCH(Input!E3, Input!B3:B32, 0))
compare:
  numbers:
    epsilon: 1e-9
  rowOrder: exact
lint:
  ban:
    - volatile
    - import
    - external
