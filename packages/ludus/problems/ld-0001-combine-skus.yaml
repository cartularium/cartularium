id: ld-0001
slug: combine-skus
title: Combine SKUs
attribution: Adapted from "Combine SKUs" in the astral.cafe Community Practice Problems sheet.
difficulty: 3
requires:
  - arrays
tags:
  - aggregation
  - arrays
statement: |
  Your client receives monthly sales reports, and needs them combined into
  a single yearly report. Each monthly table lists SKU, Quantity, Total Price,
  and Average Price — with SKUs repeating within and across months.

  Collate the tables: for every SKU that appears anywhere, produce one row with
  the SKU, total Quantity, total Total Price, and the true Average Price
  (total price divided by total quantity). Row order is up to you.
challenges:
  - oner
  - lambdaless
  - golfed
