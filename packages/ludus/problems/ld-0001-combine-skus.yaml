  sheets:
    - title: About
    - title: Input
    - title: Answer
  input: Input!A1:L9
  output: Answer!A2:D40
  spreadsheetId: 172WYZVhRB85DPn_eNW09EL5z8oBFA7C-kztwbHemf6Y
  answerHeaders:
    - SKU
    - Quantity
    - Total Price
    - Average Price
reference: =LET(t, {Input!A2:D9; Input!E2:H9; Input!I2:L9}, d, FILTER(t, INDEX(t,,1)<>""), QUERY(d,
  "select Col1, sum(Col2), sum(Col3), sum(Col3)/sum(Col2) group by Col1 label sum(Col2) '',
  sum(Col3) '', sum(Col3)/sum(Col2) ''", 0))
