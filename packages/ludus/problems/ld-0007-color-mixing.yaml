id: ld-0007
slug: color-mixing
title: Color Mixing
attribution: Adapted from "Color Mixing" in the astral.cafe Community Practice Problems sheet.
difficulty: 7
requires:
  - arrays
tags:
  - arrays
  - graphs
statement: |
  Your client is an artist with a list of colors and their components. They
  tell you that ultimately, all pigments break down into the primary colors:
  Red, Yellow, and Blue.

  Every color in the list is a mix of exactly two components. A component is
  either a primary color or another color from the list (possibly the same
  component twice). A color's breakdown is the sum of its two components'
  breakdowns; a primary's breakdown is one unit of itself. Mixtures never
  loop back on themselves.

  Determine each color's breakdown into primaries, in the same row of OUTPUT
  as the color, formatted exactly like "3 Red, 2 Yellow, 1 Blue" (counts are
  not reduced). The grader swaps in color lists of different lengths, so
  cover the whole OUTPUT range: empty input rows must produce empty output
  rows.
challenges:
  - oner
  - golfed
  - generalized
template:
  sheets:
    - title: About
    - title: Input
    - title: Answer
  input: Input!B2:D20
  output: Answer!B3:B20
  answerHeaders:
    - Breakdown
  spreadsheetId: 1xp_N5fE2o-JvvGu6ZHMl88D9uzM2uawbLJotP-run84
reference: =LET(all, Input!B3:B20, names, FILTER(all, all <> ""), m, ROWS(names), compa,
  ARRAY_CONSTRAIN(Input!C3:C20, m, 1), compb, ARRAY_CONSTRAIN(Input!D3:D20, m, 1), tn,
  TRANSPOSE(names), adj, ARRAYFORMULA((compa = tn) * 1 + (compb = tn) * 1), ident,
  ARRAYFORMULA((SEQUENCE(m) = SEQUENCE(1, m)) * 1), prim, ARRAYFORMULA((compa = {"Red", "Yellow",
  "Blue"}) * 1 + (compb = {"Red", "Yellow", "Blue"}) * 1), vec,
  ARRAYFORMULA(ROUND(MMULT(MINVERSE(ident - adj), prim), 0)), ARRAYFORMULA(INDEX(vec, , 1) & " Red,
  " & INDEX(vec, , 2) & " Yellow, " & INDEX(vec, , 3) & " Blue"))
compare:
  numbers:
    epsilon: 1e-9
  rowOrder: exact
