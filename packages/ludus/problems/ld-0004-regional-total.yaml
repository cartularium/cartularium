id: ld-0004
slug: regional-total
title: Regional Total
difficulty: 1
tags:
  - aggregation
statement: |
  Your client keeps a running sales log: one row per sale, with the region it
  came from and the amount. They want a single number — the total sales for
  one particular region, named in the Target region cell.

  Regions repeat throughout the log, and the log isn't sorted. Produce the
  total for the target region.
