id: ld-0014
slug: letter-grades
title: Letter Grades
difficulty: 2
tags:
  - lookup
statement: |
  Your client teaches a course and needs scores turned into grades. The
  grading scheme is a boundary table: each row gives the minimum score for a
  grade, sorted from lowest to highest. A score earns the grade on the last
  row whose minimum is less than or equal to it. The lowest minimum is
  always low enough to catch every score.

  Produce the grade for each score, one row per score, aligned with the
  input. The grader swaps in different schemes and score lists — different
  cutoffs, different labels, different lengths — so read both tables and
  cover the whole OUTPUT range: empty score rows must produce empty output
  rows.
template:
  sheets:
    - title: About
    - title: Input
    - title: Answer
  input: Input!B2:E23
  output: Answer!B3:B23
  answerHeaders:
    - Grade
  spreadsheetId: 1X03RgsLx_G9phTRGrR_Zk54KzGsBzHVOHfS5Y_JUJ1g
reference: =LET(bt, FILTER(Input!B3:C9, Input!B3:B9 <> ""), MAP(Input!E3:E23, LAMBDA(s, IF(s = "",
  "", VLOOKUP(s, bt, 2, TRUE)))))
selftest:
  alt: =LET(mins, FILTER(Input!B3:B9, Input!B3:B9 <> ""), grades, FILTER(Input!C3:C9, Input!B3:B9 <>
    ""), MAP(Input!E3:E23, LAMBDA(s, IF(s = "", "", INDEX(grades, SUMPRODUCT((mins <= s) * 1))))))
compare:
  numbers:
    epsilon: 1e-9
  rowOrder: exact
