id: ld-0017
slug: traveling-salesman
title: Traveling Salesman
difficulty: 9
requires:
  - arrays
  - lambda
  - algorithmic
tags:
  - graphs
  - algorithms
statement: |
  Your client runs same-day deliveries. Each morning the van leaves the
  depot, visits every client location exactly once, and returns to the
  depot. The city is full of one-way streets, so travel times are
  asymmetric: the table gives minutes from the row's location to the
  column's location, and A-to-B rarely equals B-to-A.

  The depot is the first row. Produce the fastest full route as a list of
  location names, one per row of OUTPUT: the depot, every location in
  visiting order, and the depot again at the end. There is always exactly
  one fastest route. Up to seven locations total.
challenges:
  - oner
  - generalized
  - golfed
template:
  sheets:
    - title: About
    - title: Input
    - title: Answer
  input: Input!B2:I9
  output: Answer!B3:B10
  answerHeaders:
    - Route
  spreadsheetId: 1uum0rQg7p8IPScH0HF6Wx0Mi54J8a8_P9il0do_EiFc
reference: =LET(names, FILTER(Input!B3:B9, Input!B3:B9 <> ""), m, ROWS(names), dmat,
  ARRAYFORMULA(ARRAY_CONSTRAIN(Input!C3:I9, m, m) * 1), nf, m - 1, full, 2 ^ nf - 1, big, 99999999,
  dstart, LAMBDA(j, INDEX(dmat, 1, j + 1)), dcost, LAMBDA(i, j, INDEX(dmat, i + 1, j + 1)), dback,
  LAMBDA(j, INDEX(dmat, j + 1, 1)), bitin, LAMBDA(sv, j, BITAND(sv, 2 ^ (j - 1)) > 0), pcount,
  LAMBDA(sv, SUMPRODUCT(ARRAYFORMULA((BITAND(sv, 2 ^ SEQUENCE(1, nf, 0)) > 0) * 1))), init,
  MAKEARRAY(full, nf, LAMBDA(sv, j, IF(sv = 2 ^ (j - 1), dstart(j), big))), tbl, REDUCE(init,
  SEQUENCE(nf - 1, 1, 2), LAMBDA(prev, k, MAKEARRAY(full, nf, LAMBDA(sv, j, IF(OR(pcount(sv) <> k,
  NOT(bitin(sv, j))), INDEX(prev, sv, j), LET(sm, sv - 2 ^ (j - 1), MIN(MAP(SEQUENCE(nf), LAMBDA(i,
  IF(bitin(sm, i), INDEX(prev, sm, i) + dcost(i, j), big)))))))))), endcosts, MAP(SEQUENCE(nf),
  LAMBDA(j, INDEX(tbl, full, j) + dback(j))), bestj, MATCH(MIN(endcosts), endcosts, 0), walked,
  REDUCE(full & "~" & bestj & "~" & INDEX(names, bestj + 1), SEQUENCE(nf - 1), LAMBDA(acc, t,
  LET(scur, VALUE(REGEXEXTRACT(acc, "^([^~]+)")), j, VALUE(REGEXEXTRACT(acc, "^[^~]+~([^~]+)")),
  path, REGEXEXTRACT(acc, "^[^~]+~[^~]+~(.*)$"), sm, scur - 2 ^ (j - 1), pj, MATCH(INDEX(tbl, scur,
  j), MAP(SEQUENCE(nf), LAMBDA(i, IF(bitin(sm, i), INDEX(tbl, sm, i) + dcost(i, j), big))), 0), sm &
  "~" & pj & "~" & INDEX(names, pj + 1) & "◆" & path))), fin, REGEXEXTRACT(walked,
  "^[^~]+~[^~]+~(.*)$"), TRANSPOSE(SPLIT(INDEX(names, 1) & "◆" & fin & "◆" & INDEX(names, 1), "◆")))
selftest:
  alt: =LET(names, FILTER(Input!B3:B9, Input!B3:B9 <> ""), m, ROWS(names), dmat,
    ARRAYFORMULA(ARRAY_CONSTRAIN(Input!C3:I9, m, m) * 1), nf, m - 1, np, PRODUCT(SEQUENCE(nf)),
    fact, LAMBDA(x, IF(x = 0, 1, PRODUCT(SEQUENCE(x)))), digits, TEXTJOIN("", 1, SEQUENCE(1, nf)),
    evalp, LAMBDA(p, LET(res, REDUCE(0 & "~1~" & digits & "~", SEQUENCE(nf), LAMBDA(acc, t,
    LET(cost, VALUE(REGEXEXTRACT(acc, "^([^~]+)")), cur, VALUE(REGEXEXTRACT(acc, "^[^~]+~([^~]+)")),
    rem, REGEXEXTRACT(acc, "^[^~]+~[^~]+~([^~]*)~"), ord, REGEXEXTRACT(acc, "~([^~]*)$"), cnt,
    LEN(rem), pos, MOD(FLOOR(p / fact(cnt - 1)), cnt) + 1, pick, VALUE(MID(rem, pos, 1)), (cost +
    INDEX(dmat, cur, pick + 1)) & "~" & (pick + 1) & "~" & (LEFT(rem, pos - 1) & MID(rem, pos + 1,
    9)) & "~" & (ord & MID(rem, pos, 1))))), LET(cost, VALUE(REGEXEXTRACT(res, "^([^~]+)")), cur,
    VALUE(REGEXEXTRACT(res, "^[^~]+~([^~]+)")), ord, REGEXEXTRACT(res, "~([^~]*)$"), (cost +
    INDEX(dmat, cur, 1)) & "~" & ord))), all, MAP(SEQUENCE(np, 1, 0), evalp), vals,
    ARRAYFORMULA(VALUE(REGEXEXTRACT(all, "^([^~]+)"))), bidx, MATCH(MIN(vals), vals, 0), ord,
    REGEXEXTRACT(INDEX(all, bidx), "~(.*)$"), route, TEXTJOIN("◆", 1, MAP(SEQUENCE(LEN(ord)),
    LAMBDA(q, INDEX(names, VALUE(MID(ord, q, 1)) + 1)))), TRANSPOSE(SPLIT(INDEX(names, 1) & "◆" &
    route & "◆" & INDEX(names, 1), "◆")))
