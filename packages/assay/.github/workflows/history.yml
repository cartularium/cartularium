name: history

on:
  schedule:
    # weekly Monday 06:00 UTC — clear of weekend + US-east mornings
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute deltas but write nothing (no PR)'
        type: boolean
        default: false
      note:
        description: 'Free-form note attached to the run row'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

# one history run at a time — local lockfile would catch overlap, but gating
# at the workflow level avoids spurious failed jobs
concurrency:
  group: history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install libreoffice + soffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync (python deps)
        run: uv sync --frozen

      - name: Build assay
        run: |
          npm ci
          npm run build

      - name: Compute run-stamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Regenerate fixtures (ci-friendly engines only)
        # gsheets needs oauth, excel needs a desktop install, lattice needs the
        # lattice repo + cargo build — all of those land via local manual runs
        run: |
          node build/cli.js generate -p ironcalc,hyperformula,formulas,pycel,libreoffice

      - name: Record history
        run: |
          NOTE="${{ inputs.note }}"
          NOTE="${NOTE:-weekly cron}"
          DRY_RUN=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN="--dry-run"; fi
          node build/cli.js history --record --trigger=cron --note "$NOTE" $DRY_RUN

      - name: Capture summary for PR body
        id: summary
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          {
            echo 'body<<EOF'
            echo '## History snapshot'
            echo ''
            echo '```'
            node build/cli.js history --inspect latest
            echo '```'
            echo ''
            echo '_This PR was opened by `.github/workflows/history.yml` on the weekly cron. Review the diffs in `history/` and `divergences/` and merge if everything looks right._'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: ${{ inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: "history: cron ${{ steps.stamp.outputs.date }}"
          body: ${{ steps.summary.outputs.body }}
          branch: history/cron-${{ steps.stamp.outputs.date }}
          delete-branch: true
          commit-message: |
            history: weekly cron ${{ steps.stamp.outputs.date }}
          # only stage paths the workflow touches — avoid sweeping incidental changes
          add-paths: |
            history/
            divergences/
            fixtures/
