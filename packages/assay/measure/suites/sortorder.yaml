schemaVersion: 3
name: "sweep: feature:sort-order"
tests:
  - subject: feature:sort-order
    name: num-asc
    formula: =SORT(D1:D3)
    category: value
    status: observed
    tags:
      - sweep:feature:sort-order
      - ax:data=num
      - ax:order=asc
    grid:
      D1: 3
      D2: 1
      D3: 2
