schemaVersion: 3
name: Volatile functions
tests:
  - subject: RAND
    subjectRef: RAND
    formula: =ISNUMBER(RAND())
    category: value
    expect: true
    tags:
      - volatile
    name: rand-returns-number
  - subject: RAND
    subjectRef: RAND
    formula: =RAND()>=0
    category: value
    expect: true
    tags:
      - volatile
    name: rand-ge-zero
  - subject: RAND
    subjectRef: RAND
    formula: =RAND()<1
    category: value
    expect: true
    tags:
      - volatile
    name: rand-lt-one
  - subject: RAND
    subjectRef: RAND
    formula: =ISNUMBER(RAND()+SEQUENCE(3))
    category: value
    features:
      - broadcasting
      - dynamic-arrays
    expect:
      - - true
      - - true
      - - true
    overrides:
      hyperformula:
        cause: array-handling
        recorded: false
        note: no broadcasting of RAND() over SEQUENCE; collapses to scalar
    tags:
      - volatile
      - broadcast
    name: rand-in-array-context-returns-array
  - subject: RANDBETWEEN
    subjectRef: RANDBETWEEN
    formula: =INT(RANDBETWEEN(1,10))=RANDBETWEEN(1,10)
    category: volatile
    status: volatile
    expect:
      type: boolean
    tags:
      - volatile
      - divergence
    name: randbetween-returns-integer
  - subject: RANDBETWEEN
    subjectRef: RANDBETWEEN
    category: volatile
    status: volatile
    formula: =RANDBETWEEN(5,5)
    expect:
      type: number
    tags:
      - volatile
    name: randbetween-bounds-low
  - subject: RANDBETWEEN
    subjectRef: RANDBETWEEN
    formula: =RANDBETWEEN(10,1)
    category: volatile
    status: volatile
    expect:
      any-of:
        - type: number
        - error: "#NUM!"
    overrides:
      lattice:
        cause: arg-semantics
        recorded: 8
        note: lattice silently swaps reverse-args
    tags:
      - volatile
      - divergence
    name: randbetween-reversed-bounds
  - subject: RANDBETWEEN
    subjectRef: RANDBETWEEN
    formula: =AND(RANDBETWEEN(-10,-5)>=-10, RANDBETWEEN(-10,-5)<=-5)
    category: value
    expect: true
    tags:
      - volatile
    name: randbetween-negative-range
  - subject: RANDARRAY
    subjectRef: RANDARRAY
    formula: =ROWS(RANDARRAY(2,3))&"x"&COLUMNS(RANDARRAY(2,3))
    category: value
    features:
      - broadcasting
      - dynamic-arrays
    expect: 2x3
    overrides:
      hyperformula:
        cause: missing-function
        recorded:
          error: "#NAME?"
        note: hyperformula lacks RANDARRAY
    tags:
      - volatile
      - divergence
    name: randarray-2x3-shape
  - subject: RANDARRAY
    subjectRef: RANDARRAY
    formula: =RANDARRAY(1, 3, 1, 10, TRUE)
    category: volatile
    features:
      - broadcasting
      - dynamic-arrays
    status: volatile
    expect:
      any-of:
        - shape:
            - 1
            - 3
        - error: any
    tags:
      - volatile
      - divergence
    name: randarray-integer-mode
  - subject: NOW
    subjectRef: NOW
    formula: =ISNUMBER(NOW())
    category: value
    expect: true
    overrides:
      lattice:
        cause: arg-semantics
        recorded: false
        note: lattice's NOW() returns a non-numeric value
    tags:
      - volatile
    name: now-returns-number
  - subject: NOW
    subjectRef: NOW
    formula: =NOW()>0
    category: value
    expect: true
    tags:
      - volatile
    name: now-gt-zero
  - subject: TODAY
    subjectRef: TODAY
    formula: =ISNUMBER(TODAY())
    category: value
    expect: true
    overrides:
      lattice:
        cause: arg-semantics
        recorded: false
        note: lattice's TODAY() returns a non-numeric value
    tags:
      - volatile
    name: today-returns-number
  - subject: TODAY
    subjectRef: TODAY
    formula: =TODAY()>0
    category: value
    expect: true
    tags:
      - volatile
    name: today-gt-zero
  - subject: NOW
    subjectRef: NOW
    formula: =NOW()>=TODAY()
    category: value
    expect: true
    tags:
      - volatile
    name: now-ge-today
  - subject: NOW
    subjectRef: NOW
    formula: =TODAY()=INT(NOW())
    category: value
    expect: true
    overrides:
      lattice:
        cause: arg-semantics
        recorded:
          error: "#VALUE!"
    tags:
      - volatile
    name: today-equals-int-of-now
  - subject: ROW
    subjectRef: ROW
    category: value
    formula: =ROW()
    expect: 1
    tags:
      - volatile
      - divergence
    name: row-of-target-cell
  - subject: COLUMN
    subjectRef: COLUMN
    formula: =COLUMN()
    category: value
    # Cell-position-dependent: each driver picks a target cell, so the
    # 1-indexed column number depends on the chosen cell, not engine semantics.
    # COLUMN(<ref>) tests below verify 1-indexing in a portable way.
    status: observed
    tags:
      - volatile
    name: column-of-target-cell
  - subject: ROW
    subjectRef: ROW
    category: value
    formula: =ROW(A5)
    grid:
      A5: 1
    expect: 5
    tags:
      - volatile
    name: row-of-explicit-ref
  - subject: COLUMN
    subjectRef: COLUMN
    category: value
    formula: =COLUMN(C1)
    grid:
      C1: 1
    expect: 3
    tags:
      - volatile
    name: column-of-explicit-ref
  - subject: ROW
    subjectRef: ROW
    formula: =ROW(A1:A3)
    category: value
    features:
      - broadcasting
    grid:
      A1: 1
      A2: 2
      A3: 3
    expect:
      - - 1
      - - 2
      - - 3
    overrides:
      hyperformula:
        cause: shape
        recorded: 1
    tags:
      - volatile
      - broadcast
    name: row-over-range-returns-array
  - subject: COLUMN
    subjectRef: COLUMN
    formula: =COLUMN(A1:C1)
    category: value
    features:
      - broadcasting
    grid:
      A1: 1
      B1: 2
      C1: 3
    expect:
      - - 1
        - 2
        - 3
    overrides:
      hyperformula:
        cause: shape
        recorded: 1
    tags:
      - volatile
      - broadcast
    name: column-over-range-returns-array
