schemaVersion: 3
name: Statistical functions
tests:
  - subject: AVERAGE
    subjectRef: AVERAGE
    category: value
    formula: =AVERAGE(1, 2, 3, 4)
    expect: 2.5
    name: average-basic
  - subject: AVERAGE
    subjectRef: AVERAGE
    category: value
    formula: =AVERAGE(B1:B3)
    grid:
      B1: 1
      B2: 2
      B3: 3
    expect: 2
    name: average-with-grid
  - subject: COUNT
    subjectRef: COUNT
    formula: =COUNT(B1:B3)
    category: value
    grid:
      B1: 3.14
      B2: hello
      B3: true
    expect: 1
    overrides:
      libreoffice:
        cause: arg-semantics
        recorded: 2
        note: libreoffice counts text-cells that look numeric
    tags:
      - divergence
    name: count-numbers-only
  - subject: COUNT
    subjectRef: COUNT
    category: value
    formula: =COUNT(1, 2, 3)
    expect: 3
    name: count-inline-statistical
  - subject: COUNTA
    subjectRef: COUNTA
    category: value
    status: observed
    formula: =COUNTA(B1:B3)
    grid:
      B1: 3.14
      B2: hello
      B3: ""
    tags:
      - divergence
    name: counta-non-empty
  - subject: COUNTBLANK
    subjectRef: COUNTBLANK
    category: value
    status: observed
    formula: =COUNTBLANK(A1:A5)
    grid:
      A1: 1
      A2: ""
      A3: hello
    tags:
      - divergence
    name: countblank
  - subject: COUNTIF
    subjectRef: COUNTIF
    category: value
    formula: =COUNTIF(A1:A4, ">2")
    grid:
      A1: 1
      A2: 2
      A3: 3
      A4: 4
    expect: 2
    name: countif-greater-than
  - subject: MAX
    subjectRef: MAX
    category: value
    formula: =MAX(1, 5, 3, 2, 4)
    expect: 5
    name: max-basic
  - subject: MAX
    subjectRef: MAX
    category: value
    formula: =MAX(A1:A3)
    grid:
      A1: 10
      A2: 30
      A3: 20
    expect: 30
    name: max-with-grid
  - subject: MIN
    subjectRef: MIN
    category: value
    formula: =MIN(1, 5, 3, 2, 4)
    expect: 1
    name: min-basic
  - subject: MIN
    subjectRef: MIN
    category: value
    formula: =MIN(A1:A3)
    grid:
      A1: 10
      A2: 30
      A3: 20
    expect: 10
    name: min-with-grid
  - subject: LARGE
    subjectRef: LARGE
    category: value
    formula: =LARGE({3,1,4,1,5,9}, 1)
    expect: 9
    tags:
      - bare-formula
    name: large-1st-statistical
  - subject: LARGE
    subjectRef: LARGE
    category: value
    formula: =LARGE({3,1,4,1,5,9}, 3)
    expect: 4
    tags:
      - bare-formula
    name: large-3rd-statistical
  - subject: SMALL
    subjectRef: SMALL
    category: value
    formula: =SMALL({3,1,4,1,5,9}, 1)
    expect: 1
    tags:
      - bare-formula
    name: small-1st-statistical
  - subject: SMALL
    subjectRef: SMALL
    category: value
    formula: =SMALL({3,1,4,1,5,9}, 2)
    expect: 1
    tags:
      - bare-formula
    name: small-2nd
  - subject: MEDIAN
    subjectRef: MEDIAN
    formula: =MEDIAN(1, 2, 3, 4, 5)
    category: value
    expect: 3
    overrides:
      pycel:
        cause: missing-function
        recorded:
          error: "#NAME?"
    name: median-odd-count-statistical
  - subject: MEDIAN
    subjectRef: MEDIAN
    formula: =MEDIAN(1, 2, 3, 4)
    category: value
    expect: 2.5
    overrides:
      pycel:
        cause: missing-function
        recorded:
          error: "#NAME?"
    name: median-even-count-statistical
  - subject: SUMIF
    subjectRef: SUMIF
    category: value
    formula: =SUMIF(A1:A3, ">1")
    grid:
      A1: 1
      A2: 2
      A3: 3
    expect: 5
    name: sumif-greater-than
  - subject: SUMIFS
    subjectRef: SUMIFS
    category: value
    formula: =SUMIFS(A1:A4, B1:B4, "=A*")
    grid:
      A1: 5
      A2: 4
      A3: 15
      A4: 22
      B1: Apples
      B2: Bananas
      B3: Almonds
      B4: Yoni
    expect: 20
    name: sumifs-with-text-criteria
  - subject: MAXIFS
    subjectRef: MAXIFS
    formula: =MAXIFS(A1:A4, B1:B4, "=A*")
    category: value
    grid:
      A1: 5
      A2: 4
      A3: 15
      A4: 22
      B1: Apples
      B2: Bananas
      B3: Almonds
      B4: Yoni
    expect: 15
    overrides:
      libreoffice:
        cause: missing-function
        recorded:
          error: "#NAME?"
    name: maxifs-with-criteria
  - subject: MINIFS
    subjectRef: MINIFS
    formula: =MINIFS(A1:A4, B1:B4, "=A*")
    category: value
    grid:
      A1: 5
      A2: 4
      A3: 15
      A4: 22
      B1: Apples
      B2: Bananas
      B3: Almonds
      B4: Yoni
    expect: 5
    overrides:
      libreoffice:
        cause: missing-function
        recorded:
          error: "#NAME?"
    name: minifs-with-criteria
