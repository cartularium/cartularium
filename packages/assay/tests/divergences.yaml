schemaVersion: 3
name: Known divergences
tests:
  - subject: CONCAT
    subjectRef: CONCAT
    formula: =CONCAT("a", "b", "c")
    category: value
    expect: abc
    overrides:
      gsheets:
        cause: error-code
        recorded:
          error: "#N/A"
      hyperformula:
        cause: missing-function
        recorded:
          error: "#NAME?"
      libreoffice:
        cause: missing-function
        recorded:
          error: "#NAME?"
    tags:
      - text
      - divergence
    name: concat-vs-concatenate-arity
  - subject: lit:array
    subjectRef: lit:array
    category: value
    status: observed
    formula: ={1;2;3}
    tags:
      - array
      - divergence
      - bare-formula
    name: array-literal-semicolons
  - subject: LAMBDA
    subjectRef: LAMBDA
    category: value
    features:
      - lambda
    formula: =LAMBDA(x, x+1)(5)
    expect: 6
    tags:
      - lambda
    name: lambda-named-function-inline-cost
  - subject: HSTACK
    subjectRef: HSTACK
    formula: =HSTACK(A1, 1/0)
    category: error-code
    features:
      - dynamic-arrays
    grid:
      A1: 1
    expect:
      - - 1
        - error: "#DIV/0!"
    overrides:
      excel:
        cause: error-code
        recorded:
          error: "#DIV/0!"
      lattice:
        cause: error-code
        recorded:
          error: "#DIV/0!"
    tags:
      - array
      - divergence
      - error
    name: hstack-with-error-value
  - subject: SWITCH
    subjectRef: SWITCH
    formula: =SWITCH(1, 1, "yes")
    category: value
    expect: yes
    overrides:
      libreoffice:
        cause: missing-function
        recorded:
          error: "#NAME?"
      pycel:
        cause: missing-function
        recorded:
          error: "#NAME?"
    tags:
      - logical
      - divergence
    name: switch-3-arg-form
  - subject: SWITCH
    subjectRef: SWITCH
    formula: =SWITCH(99, 1, "one", "default")
    category: value
    expect: default
    overrides:
      libreoffice:
        cause: missing-function
        recorded:
          error: "#NAME?"
      pycel:
        cause: missing-function
        recorded:
          error: "#NAME?"
    tags:
      - logical
      - divergence
    name: switch-4-arg-with-no-match
  - subject: op:=
    subjectRef: op:eq
    category: value
    formula: =0=""
    expect: false
    tags:
      - type-coercion
      - divergence
    name: empty-string-vs-zero-comparison
  - subject: "TRUE"
    subjectRef: lit:boolean
    category: value
    formula: =TRUE+1
    expect: 2
    overrides:
      hyperformula:
        cause: missing-function
        recorded:
          error: "#NAME?"
    tags:
      - type-coercion
      - divergence
    name: true-1
  - subject: feature:space-intersection
    subjectRef: feature:space-intersection
    category: value
    status: observed
    formula: =SUM(B1:B3 B2:B2)
    grid:
      B1: 1
      B2: 2
      B3: 3
    tags:
      - reference-operators
      - divergence
      - reconfirm-june
    name: space-intersection-in-sum
  - subject: feature:reference-union
    subjectRef: feature:reference-union
    category: value
    status: observed
    formula: =SUM((B1:B1,B3:B3))
    grid:
      B1: 1
      B3: 3
    tags:
      - reference-operators
      - divergence
      - reconfirm-june
    name: union-in-sum
  - subject: feature:implicit-intersection
    subjectRef: feature:implicit-intersection
    category: value
    status: observed
    formula: =SUM(@B1:B3)
    grid:
      B1: 1
      B2: 2
      B3: 3
    tags:
      - implicit-intersection
      - divergence
      - reconfirm-june
    name: at-inside-sum
  - subject: REGEXMATCH
    subjectRef: REGEXMATCH
    category: value
    status: observed
    formula: =REGEXMATCH("abc123", "[0-9]+")
    tags:
      - regex
      - divergence
      - reconfirm-june
    features:
      - regex
    name: regexmatch-native-name-cross-engine
  - subject: REGEXTEST
    subjectRef: REGEXTEST
    category: value
    status: observed
    formula: =REGEXTEST("abc123", "[0-9]+")
    tags:
      - regex
      - divergence
      - reconfirm-june
    features:
      - regex
    name: regextest-native-name-cross-engine
