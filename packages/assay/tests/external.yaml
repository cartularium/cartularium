schemaVersion: 3
name: Google, Web, and external-I/O functions
tests:
  - subject: "TRUE"
    category: value
    formula: =TRUE()
    expect: true
    tags:
      - logical
    name: true-basic
  - subject: "FALSE"
    category: value
    formula: =FALSE()
    expect: false
    tags:
      - logical
    name: false-basic
  - subject: SORTN
    category: value
    supportLevel: unsupported
    formula: =SORTN({5;2;8;1;4}, 3)
    expect:
      error: "#NAME?"
    overrides:
      gsheets:
        cause: shape
        recorded:
          - - 1
          - - 2
          - - 4
    tags:
      - filter
      - bare-formula
    name: sortn-top-3
  - subject: SORTN
    category: value
    supportLevel: unsupported
    formula: =SORTN({5;2;8;1;4}, 3, 0, 1, TRUE)
    expect:
      error: "#NAME?"
    overrides:
      gsheets:
        cause: shape
        recorded:
          - - 1
          - - 2
          - - 4
    tags:
      - filter
      - bare-formula
    name: sortn-top-3-ascending
