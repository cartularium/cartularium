schemaVersion: 3
name: Broadcasting
tests:
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: =1+{10,20,30}
    expect:
      - - 11
        - 21
        - 31
    tags:
      - broadcast
      - operator
    name: add-scalar-to-row-vector
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: =1+{10;20;30}
    expect:
      - - 11
      - - 21
      - - 31
    tags:
      - broadcast
      - operator
    name: add-scalar-to-column-vector
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: =1+{10,20;30,40}
    expect:
      - - 11
        - 21
      - - 31
        - 41
    tags:
      - broadcast
      - operator
    name: add-scalar-to-2d
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}+{10;20;30}
    expect:
      - - 11
        - 12
        - 13
      - - 21
        - 22
        - 23
      - - 31
        - 32
        - 33
    tags:
      - broadcast
      - operator
      - outer-product
    name: add-row-to-column-outer-product
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: ={1;2;3}+{10,20,30}
    expect:
      - - 11
        - 21
        - 31
      - - 12
        - 22
        - 32
      - - 13
        - 23
        - 33
    tags:
      - broadcast
      - operator
      - outer-product
    name: add-column-to-row-outer-product
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}+{10,20,30}
    expect:
      - - 11
        - 22
        - 33
    tags:
      - broadcast
      - operator
    name: add-row-vectors-same-length
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: ={1;2;3}+{10;20;30}
    expect:
      - - 11
      - - 22
      - - 33
    tags:
      - broadcast
      - operator
    name: add-column-vectors-same-length
  - subject: ADD
    category: shape
    features:
      - broadcasting
    formula: ={1,2;3,4}+{10,20;30,40}
    expect:
      - - 11
        - 22
      - - 33
        - 44
    tags:
      - broadcast
      - operator
    name: add-2d-same-shape
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}+{10,20,30;40,50,60}
    expect:
      - - 11
        - 22
        - 33
      - - 41
        - 52
        - 63
    tags:
      - broadcast
      - operator
    name: add-row-broadcast-across-2d
  - subject: ADD
    category: value
    features:
      - broadcasting
    formula: ={1;2}+{10,20,30;40,50,60}
    expect:
      - - 11
        - 21
        - 31
      - - 42
        - 52
        - 62
    tags:
      - broadcast
      - operator
    name: add-column-broadcast-across-2d
  - subject: ADD
    category: value
    features:
      - broadcasting
    status: observed
    formula: ={1,2,3}+{10,20}
    tags:
      - broadcast
      - operator
      - divergence
    name: add-row-vectors-mismatched-length
  - subject: ADD
    category: value
    features:
      - broadcasting
    status: observed
    formula: ={1;2;3}+{10;20}
    tags:
      - broadcast
      - operator
      - divergence
    name: add-column-vectors-mismatched-length
  - subject: ADD
    category: shape
    features:
      - broadcasting
    status: observed
    formula: ={1,2;3,4}+{1,2,3;4,5,6}
    tags:
      - broadcast
      - operator
      - divergence
    name: add-2d-incompatible-shape
  - subject: MINUS
    category: value
    features:
      - broadcasting
    formula: ={10,20,30}-1
    expect:
      - - 9
        - 19
        - 29
    tags:
      - broadcast
      - operator
    name: subtract-scalar-from-row
  - subject: MINUS
    category: value
    features:
      - broadcasting
    formula: ={10;20;30}-{1,2,3}
    expect:
      - - 9
        - 8
        - 7
      - - 19
        - 18
        - 17
      - - 29
        - 28
        - 27
    tags:
      - broadcast
      - operator
      - outer-product
    name: subtract-row-from-column-outer
  - subject: MULTIPLY
    category: value
    features:
      - broadcasting
    formula: =3*{1,2,3}
    expect:
      - - 3
        - 6
        - 9
    tags:
      - broadcast
      - operator
    name: multiply-scalar-by-row
  - subject: MULTIPLY
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}*{1;2;3}
    expect:
      - - 1
        - 2
        - 3
      - - 2
        - 4
        - 6
      - - 3
        - 6
        - 9
    tags:
      - broadcast
      - operator
      - outer-product
    name: multiply-row-by-column-outer
  - subject: DIVIDE
    category: value
    features:
      - broadcasting
    formula: ={10,20,30}/10
    expect:
      - - 1
        - 2
        - 3
    tags:
      - broadcast
      - operator
    name: divide-row-by-scalar
  - subject: DIVIDE
    category: value
    features:
      - broadcasting
    formula: =60/{1,2,3}
    expect:
      - - 60
        - 30
        - 20
    tags:
      - broadcast
      - operator
    name: divide-scalar-by-row
  - subject: POW
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}^2
    expect:
      - - 1
        - 4
        - 9
    tags:
      - broadcast
      - operator
    name: exponent-row-elementwise
  - subject: POW
    category: value
    features:
      - broadcasting
    formula: =2^{0,1,2,3}
    expect:
      - - 1
        - 2
        - 4
        - 8
    tags:
      - broadcast
      - operator
    name: exponent-scalar-over-row
  - subject: op:unary-
    category: value
    features:
      - broadcasting
    formula: =-{1,-2,3}
    expect:
      - - -1
        - 2
        - -3
    tags:
      - broadcast
      - operator
      - unary
    name: unary-minus-on-row
  - subject: op:unary-
    category: value
    features:
      - broadcasting
    formula: =-{1,2;3,4}
    expect:
      - - -1
        - -2
      - - -3
        - -4
    tags:
      - broadcast
      - operator
      - unary
    name: unary-minus-on-2d
  - subject: op:%
    category: value
    features:
      - broadcasting
    formula: ={50,100,200}%
    expect:
      - - 0.5
        - 1
        - 2
    tags:
      - broadcast
      - operator
      - unary
    subjectRef: legacy:6f703a25
    name: percent-on-row
  - subject: op:=
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}=2
    expect:
      - - false
        - true
        - false
    tags:
      - broadcast
      - operator
      - comparison
    name: equals-scalar-against-row
  - subject: op:<
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}<2
    expect:
      - - true
        - false
        - false
    tags:
      - broadcast
      - operator
      - comparison
    name: less-than-scalar-against-row
  - subject: op:>=
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}>={2,2,2}
    expect:
      - - false
        - true
        - true
    tags:
      - broadcast
      - operator
      - comparison
    name: greater-equal-row-vs-row
  - subject: op:<>
    category: value
    features:
      - broadcasting
    formula: ={1,2,3}<>{1;2;3}
    expect:
      - - false
        - true
        - true
      - - true
        - false
        - true
      - - true
        - true
        - false
    tags:
      - broadcast
      - operator
      - comparison
      - outer-product
    name: not-equal-outer-product
  - subject: op:>
    category: value
    features:
      - broadcasting
    formula: ={1,2;3,4}>2
    expect:
      - - false
        - false
      - - true
        - true
    tags:
      - broadcast
      - operator
      - comparison
    name: comparison-2d-vs-scalar
  - subject: op:&
    category: value
    features:
      - broadcasting
    formula: ="x"&{"a","b","c"}
    expect:
      - - xa
        - xb
        - xc
    tags:
      - broadcast
      - operator
      - concat
    name: concat-scalar-to-row
  - subject: op:&
    category: value
    features:
      - broadcasting
    formula: ={"a","b"}&{"1";"2";"3"}
    expect:
      - - a1
        - b1
      - - a2
        - b2
      - - a3
        - b3
    tags:
      - broadcast
      - operator
      - concat
      - outer-product
    name: concat-row-and-column-outer
  - subject: op:&
    formula: ="v"&{1,2,3}
    category: value
    features:
      - broadcasting
    expect:
      - - v1
        - v2
        - v3
    overrides:
      formulas:
        cause: error-code
        recorded:
          - - error: "#1"
            - error: "#2"
            - error: "#3"
    tags:
      - broadcast
      - operator
      - concat
      - coercion
    name: concat-row-with-numbers-coerced
  - subject: op:+
    category: value
    features:
      - broadcasting
    formula: =A1:A3+C1:E1
    grid:
      A1: 1
      A2: 2
      A3: 3
      C1: 10
      D1: 20
      E1: 30
    expect:
      - - 11
        - 21
        - 31
      - - 12
        - 22
        - 32
      - - 13
        - 23
        - 33
    tags:
      - broadcast
      - operator
      - range
    name: range-column-plus-range-row-outer
  - subject: op:*
    category: value
    features:
      - broadcasting
    formula: =A1:A3*10
    grid:
      A1: 1
      A2: 2
      A3: 3
    expect:
      - - 10
      - - 20
      - - 30
    tags:
      - broadcast
      - operator
      - range
    name: range-vs-scalar-broadcast
  - subject: op:*
    category: value
    features:
      - broadcasting
    formula: =A1:A2*B1:B2
    grid:
      A1: 1
      A2: 2
      B1: 10
      B2: 20
    expect:
      - - 10
      - - 40
    tags:
      - broadcast
      - operator
      - range
    name: range-times-range-elementwise
  - subject: LEN
    formula: =LEN({"a","bb","ccc"})
    category: value
    features:
      - broadcasting
    expect:
      - - 1
        - 2
        - 3
    tags:
      - broadcast
    name: len-over-string-row
  - subject: UPPER
    category: value
    features:
      - broadcasting
    formula: =UPPER({"a";"bc";"def"})
    expect:
      - - A
      - - BC
      - - DEF
    tags:
      - broadcast
    name: upper-over-string-column
  - subject: ABS
    category: value
    features:
      - broadcasting
    formula: =ABS({-1, 2, -3})
    expect:
      - - 1
        - 2
        - 3
    tags:
      - broadcast
    name: abs-over-signed-row
  - subject: SQRT
    category: value
    features:
      - broadcasting
    formula: =SQRT({1, 4, 9, 16})
    expect:
      - - 1
        - 2
        - 3
        - 4
    tags:
      - broadcast
    name: sqrt-over-row
  - subject: ISNUMBER
    category: value
    features:
      - broadcasting
    formula: =ISNUMBER({1,"a",TRUE,3})
    expect:
      - - true
        - false
        - false
        - true
    tags:
      - broadcast
    name: isnumber-over-mixed-row
  - subject: IF
    category: value
    features:
      - broadcasting
    status: observed
    formula: =IF({TRUE,FALSE,TRUE}, 1, 2)
    tags:
      - broadcast
      - divergence
    name: if-with-array-condition
  - subject: IF
    category: value
    features:
      - broadcasting
    status: observed
    formula: =IF({TRUE,FALSE,TRUE}, {10,20,30}, {-1,-2,-3})
    tags:
      - broadcast
      - divergence
    name: if-with-array-condition-and-array-branches
  - subject: IF
    category: value
    features:
      - broadcasting
    status: observed
    formula: =IF(TRUE, {1,2,3}, {10,20,30})
    tags:
      - broadcast
      - divergence
    name: if-broadcasting-scalar-condition-to-array-branches
  - subject: op:+
    formula: ={1,2,3}+{10,#N/A,30}
    category: error-code
    features:
      - broadcasting
    expect:
      - - 11
        - error: "#N/A"
        - 33
    tags:
      - broadcast
      - operator
      - error-propagation
      - divergence
    name: error-in-row-vector-propagates-per-cell
  - subject: op:+
    formula: =1+#DIV/0!
    category: error-code
    expect:
      error: "#DIV/0!"
    tags:
      - broadcast
      - operator
      - error-propagation
    name: scalar-plus-error-value
  - subject: op:/
    formula: =10/{1,0,2}
    category: value
    features:
      - broadcasting
    expect:
      - - 10
        - "#DIV/0!"
        - 5
    tags:
      - broadcast
      - operator
      - error-propagation
    name: division-by-row-with-zero
  - subject: op:+
    formula: =A1:A2+B1:B2
    category: error-code
    features:
      - broadcasting
    grid:
      A1: 1
      A2: 2
      B1: 10
      B2: =1/0
    expect:
      - - 11
      - - error: "#DIV/0!"
    tags:
      - broadcast
      - operator
      - error-propagation
      - divergence
    name: error-in-2d-operand-range
  - subject: op:+
    category: value
    features:
      - broadcasting
    formula: =A1:A3+10
    grid:
      A1: 1
      A2: null
      A3: 3
    expect:
      - - 11
      - - 10
      - - 13
    tags:
      - broadcast
      - operator
      - blank
    name: blank-in-range-treated-as-zero
  - subject: op:+
    category: value
    features:
      - broadcasting
    status: observed
    formula: ={1,,3}+10
    tags:
      - broadcast
      - operator
      - blank
      - divergence
    name: blank-literal-inside-array
  - subject: op:&
    category: value
    features:
      - broadcasting
    formula: =A1:A3&"!"
    grid:
      A1: x
      A2: null
      A3: z
    expect:
      - - x!
      - - "!"
      - - z!
    tags:
      - broadcast
      - operator
      - blank
      - concat
    name: concat-blank-coerces-to-empty-string
  - subject: op:+
    category: value
    features:
      - broadcasting
    status: observed
    formula: ={TRUE,FALSE,TRUE}+0
    tags:
      - broadcast
      - operator
      - coercion
      - divergence
    name: boolean-array-coerced-in-arithmetic
  - subject: op:+
    formula: ={"1","2","3"}+0
    category: value
    features:
      - broadcasting
    expect:
      - - 1
        - 2
        - 3
    tags:
      - broadcast
      - operator
      - coercion
      - divergence
    name: numeric-strings-in-array-coerced
  - subject: op:+
    category: value
    features:
      - broadcasting
    status: observed
    formula: ={1,"a",TRUE}+0
    tags:
      - broadcast
      - operator
      - coercion
      - divergence
    name: mixed-type-array-plus-scalar
  - subject: lit:array
    category: value
    status: observed
    formula: ={1,2;3}
    tags:
      - array
      - ragged
      - divergence
      - bare-formula
    name: ragged-array-literal
  - subject: op:+
    formula: ={1,2;3}+10
    category: value
    features:
      - broadcasting
    expect: null
    overrides:
      gsheets:
        cause: error-code
        recorded:
          error: "#VALUE!"
      lattice:
        cause: error-code
        recorded:
          error: "#VALUE!"
      hyperformula:
        cause: missing-function
        recorded:
          - - error: "#REF!"
          - - error: "#REF!"
    tags:
      - array
      - ragged
      - broadcast
      - divergence
    name: ragged-literal-in-arithmetic
  - subject: op:@
    category: value
    status: observed
    formula: =@A1:A3+1
    grid:
      A1: 10
      A2: 20
      A3: 30
    tags:
      - implicit-intersection
      - divergence
    subjectRef: legacy:6f703a40
    name: implicit-intersection-with
  - subject: feature:implicit-intersection
    category: value
    status: observed
    formula: =A1:A3+1
    grid:
      A1: 10
      A2: 20
      A3: 30
    tags:
      - implicit-intersection
      - divergence
    name: implicit-intersection-without
  - subject: LEN
    category: value
    status: observed
    formula: =LEN({"a","bb","ccc"})
    tags:
      - implicit-intersection
      - virtual-array
      - divergence
      - bare-formula
    name: virtual-array-top-left-via-implicit-intersection
  - subject: feature:implicit-intersection
    category: value
    status: observed
    formula: =A1:A3
    grid:
      A1: 100
      A2: 200
      A3: 300
    tags:
      - implicit-intersection
      - range
      - divergence
    name: range-intersects-formula-row-aa1-vs-a1-a3
  - subject: LEN
    category: value
    status: observed
    formula: =LEN(B1:B3)*1
    grid:
      B1: 100
      B2: 200
      B3: 300
    tags:
      - implicit-intersection
      - range
      - divergence
    name: range-no-intersection-errors-column-at-off-row
  - subject: SINGLE
    formula: =SINGLE({10,20,30})
    category: value
    expect: 10
    overrides:
      excel:
        cause: error-code
        recorded:
          error: "#N/A"
      ironcalc:
        cause: missing-function
        recorded:
          error: "#NAME?"
      hyperformula:
        cause: missing-function
        recorded:
          error: "#NAME?"
      libreoffice:
        cause: missing-function
        recorded:
          error: "#NAME?"
      pycel:
        cause: missing-function
        recorded:
          error: "#NAME?"
    tags:
      - implicit-intersection
      - divergence
      - bare-formula
    name: single-explicit-top-left
  - subject: INDEX
    category: value
    status: observed
    formula: =INDEX(A1:A3*10)
    grid:
      A1: 1
      A2: 2
      A3: 3
    tags:
      - broadcast
      - gsheets-idiom
      - divergence
    name: index-wraps-multiplication-over-range
  - subject: INDEX
    category: value
    status: observed
    formula: =INDEX({1,2,3}+{10;20;30})
    tags:
      - broadcast
      - outer-product
      - gsheets-idiom
      - divergence
      - bare-formula
    name: index-wraps-outer-product
  - subject: SUMPRODUCT
    formula: =SUMPRODUCT(--({1,2,3}>1))
    category: value
    expect: 2
    overrides:
      ironcalc:
        cause: missing-function
        recorded:
          error: "#NAME?"
      formulas:
        cause: arg-semantics
        recorded: 0
      pycel:
        cause: format-rendering
        recorded: "2"
    tags:
      - broadcast
      - coercion
      - double-unary
      - bare-formula
    name: double-unary-coerces-boolean-row-to-numeric
  - subject: SUMPRODUCT
    formula: =SUMPRODUCT(A1:A3, B1:B3)
    category: value
    grid:
      A1: 1
      A2: 2
      A3: 3
      B1: 10
      B2: 20
      B3: 30
    expect: 140
    overrides:
      ironcalc:
        cause: missing-function
        recorded:
          error: "#NAME?"
      pycel:
        cause: format-rendering
        recorded: "140"
    tags:
      - broadcast
    name: sumproduct-with-two-ranges
  - subject: SUMPRODUCT
    formula: =SUMPRODUCT((A1:A3>1)*B1:B3)
    category: value
    grid:
      A1: 1
      A2: 2
      A3: 3
      B1: 10
      B2: 20
      B3: 30
    expect: 50
    overrides:
      ironcalc:
        cause: missing-function
        recorded:
          error: "#NAME?"
      pycel:
        cause: format-rendering
        recorded: "50"
    tags:
      - broadcast
    name: sumproduct-with-boolean-broadcast
