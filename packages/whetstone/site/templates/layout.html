<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{description}}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{root}}/styles.css?v={{assetVersion}}">
<script>
// pre-paint theme to avoid FOUC
(function () {
  try {
    var saved = localStorage.getItem("cartularium-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (_) {}
})();
</script>
</head>
<body>

{{{topbar}}}
{{{drawer}}}

<main class="whetstone rise">
{{{body}}}
</main>

{{{footer}}}

<script defer src="{{root}}/assets/chrome.js?v={{assetVersion}}"></script>
</body>
</html>
