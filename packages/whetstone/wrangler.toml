# whetstone judge service (W7). Secrets (set via `wrangler secret put` in prod,
# .dev.vars locally — see worker/make-dev-vars.mjs):
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REFRESH_TOKEN
# Before deploying: `wrangler d1 create whetstone` and paste the real
# database_id below; `wrangler d1 migrations apply whetstone --remote`.
name = "whetstone-judge"
main = "worker/index.ts"
compatibility_date = "2026-05-01"

[[d1_databases]]
binding = "DB"
database_name = "whetstone"
database_id = "8cf5ab90-6e5d-46ac-bfaf-241909e81781"
migrations_dir = "worker/migrations"

[vars]
# comma-separated allowlist; .dev.vars overrides to "*" for local dev
ALLOWED_ORIGIN = "https://whetstone.sheets.wiki,https://whetstone-36a.pages.dev"
